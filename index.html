<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://yorimichi-api.soluto484.workers.dev; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YORIMICHI | 日韓交流ラウンジ</title>
  <meta name="description" content="YORIMICHI は日本と韓国の人が気軽に寄り道できる VRChat の交流ワールドです。広場・個室・日本語/韓国語教室があります。">
  <meta property="og:title" content="YORIMICHI | 日韓交流ラウンジ">
  <meta property="og:description" content="日本と韓国が出会う VRChat の交流ワールド · 일본과 한국이 만나는 VRChat 교류 월드">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/plaza_hero.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">
  <div id="site-header"></div>

  <main id="main">
    <section class="hero">
      <div class="hero__glow" aria-hidden="true"></div>
      <div class="container hero__grid">
        <div class="hero__copy reveal">
          <p class="pill"><span class="pill__dot"></span><span data-i18n="hero.eyebrow">VRChat ワールド · 日本語 × 한국어</span></p>
          <h1 class="hero__title" data-i18n-html="hero.title">寄り道から、<br><span class="grad">はじまる友だち。</span></h1>
          <p class="hero__lead" data-i18n="hero.lead"></p>
          <div class="hero__cta">
            <a class="btn btn--primary" data-link="world_url" href="#"><span data-i18n="cta.world">ワールドに行く</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
            <a class="btn btn--ghost" data-link="group_url" href="#" data-i18n="cta.group">グループに参加</a>
          </div>
          <ul class="hero__meta">
            <li><b>PC</b> · <b>Quest</b> · <b>Android</b></li>
            <li data-i18n="hero.tz"></li>
          </ul>
        </div>
        <div class="hero__visual reveal">
          <figure class="shot shot--hero">
            <img data-img="hero_image" src="images/plaza_hero.jpg" alt="" width="1600" height="900" fetchpriority="high">
          </figure>
          <a class="float-card float-card--next" href="schedule.html">
            <p class="float-card__label" data-i18n="hero.next">次の予定</p>
            <p class="float-card__title" id="next-title">—</p>
            <p class="float-card__meta" id="next-meta"></p>
          </a>
          <div class="float-card float-card--voice">
            <span class="float-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zm7 9a7 7 0 0 1-14 0M12 19v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
            <span data-i18n="hero.voice"></span>
          </div>
        </div>
      </div>
      <div class="container">
        <dl class="stats reveal">
          <div><dt>3</dt><dd data-i18n="stats.areas"></dd></div>
          <div><dt>6</dt><dd data-i18n="stats.rooms"></dd></div>
          <div><dt>6</dt><dd data-i18n="stats.classes"></dd></div>
          <div><dt>2</dt><dd data-i18n="stats.langs"></dd></div>
        </dl>
      </div>
    </section>

    <div class="notice-wrap container" id="notice" hidden><div class="notice"><span class="notice__dot"></span><span id="notice-text"></span></div></div>

    <section class="section" id="about">
      <div class="container">
        <header class="section__head reveal">
          <p class="eyebrow">About</p>
          <h2 data-i18n="about.title"></h2>
          <p class="section__lead" data-i18n="about.lead"></p>
        </header>
        <div class="features">
          <article class="feature reveal">
            <span class="feature__icon"><svg viewBox="0 0 24 24"><path d="M4 5h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm16 4a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1v3l-4-3h-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
            <h3 data-i18n="f1.title"></h3><p data-i18n="f1.body"></p>
          </article>
          <article class="feature reveal">
            <span class="feature__icon"><svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5zM12 15v2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <h3 data-i18n="f2.title"></h3><p data-i18n="f2.body"></p>
          </article>
          <article class="feature reveal">
            <span class="feature__icon"><svg viewBox="0 0 24 24"><path d="M3 5h18v11H3zM8 20h8M12 16v4M7 9h6M7 12h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <h3 data-i18n="f3.title"></h3><p data-i18n="f3.body"></p>
          </article>
        </div>
      </div>
    </section>

    <section class="section section--soft" id="areas">
      <div class="container">
        <header class="section__head reveal">
          <p class="eyebrow">Areas</p>
          <h2 data-i18n="areas.title"></h2>
          <p class="section__lead" data-i18n="areas.lead"></p>
        </header>
        <div class="bento">
          <article class="tile tile--wide reveal">
            <img data-img="image_plaza" src="images/plaza_lounge.jpg" alt="" loading="lazy">
            <div class="tile__body"><span class="tag">Central Plaza</span><h3 data-i18n="area.plaza.title"></h3><p data-i18n="area.plaza.body"></p></div>
          </article>
          <article class="tile reveal">
            <img data-img="image_akari" src="images/akari_corridor.jpg" alt="" loading="lazy">
            <div class="tile__body"><span class="tag">Akari-yado</span><h3 data-i18n="area.akari.title"></h3><p data-i18n="area.akari.body"></p></div>
          </article>
          <article class="tile reveal">
            <img data-img="image_kotoba" src="images/kotoba_corridor.jpg" alt="" loading="lazy">
            <div class="tile__body"><span class="tag">Kotoba Campus</span><h3>Kotoba Campus</h3><p data-i18n="area.kotoba.body"></p></div>
          </article>
          <article class="tile tile--wide reveal">
            <img data-img="image_classroom" src="images/classroom.jpg" alt="" loading="lazy">
            <div class="tile__body"><span class="tag">Classroom</span><h3 data-i18n="area.class.title"></h3><p data-i18n="area.class.body"></p></div>
          </article>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <header class="section__head section__head--row reveal">
          <div><p class="eyebrow">Schedule</p><h2 data-i18n="home.upcoming"></h2></div>
          <a class="link-more" href="schedule.html"><span data-i18n="home.allSchedule"></span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </header>
        <ol class="schedule" id="schedule-list" data-limit="3"></ol>
        <p class="empty" id="schedule-empty" hidden data-i18n="schedule.empty"></p>
      </div>
    </section>

    <section class="section section--flush" id="news" hidden>
      <div class="container">
        <header class="section__head reveal"><p class="eyebrow">News</p><h2 data-i18n="news.title"></h2></header>
        <ul class="news" id="news-list"></ul>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="join reveal">
          <div class="join__copy">
            <p class="eyebrow eyebrow--light">Join</p>
            <h2 data-i18n="join.title"></h2>
            <p class="join__lead" data-i18n="join.lead"></p>
          </div>
          <div class="join__actions">
            <a class="btn btn--light" data-link="world_url" href="#" data-i18n="cta.world"></a>
            <a class="btn btn--outline-light" data-link="group_url" href="#" data-i18n="cta.group"></a>
            <a class="btn btn--outline-light" href="guide.html" data-i18n="cta.guide"></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
</body>
</html>
