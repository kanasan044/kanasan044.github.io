<body data-page="recruit">
  <div id="site-header"></div>

    <section class="page-hero">

        <p class="eyebrow">Recruit</p>
        <h1 data-i18n="recruit.title"></h1>

        <div class="hero__cta">
          <a class="btn btn--primary" data-link="recruit_form_url" href="#"><span data-i18n="recruit.apply"></span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>

          <article class="position reveal" data-recruit="recruit_teacher">
            <div class="position__head">
              <span class="position__icon position__icon--blue"><svg viewBox="0 0 24 24"><path d="M3 5h18v11H3zM8 20h8M12 16v4M7 9h6M7 12h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

            <h2 data-i18n="recruit.teacher.title"></h2>
            <p class="position__lead" data-i18n="recruit.teacher.body"></p>
            <h3 data-i18n="recruit.want"></h3>
            <ul class="checks">
              <li data-i18n="recruit.teacher.w1"></li>
              <li data-i18n="recruit.teacher.w2"></li>
              <li data-i18n="recruit.teacher.w3"></li>

              <span class="status" data-status></span>

            <p class="position__lead" data-i18n="recruit.staff.body"></p>

              <li data-i18n="recruit.staff.w2"></li>
              <li data-i18n="recruit.staff.w3"></li>
            </ul>
          </article>
        </div>

        <div class="callout reveal">
          <h2 data-i18n="recruit.common"></h2>
          <ul class="checks checks--inline">
            <li data-i18n="recruit.c1"></li>
            <li data-i18n="recruit.c2"></li>
            <li data-i18n="recruit.c3"></li>
          </ul>
        </div>
      </div>
    </section>

    <section class="section section--soft">
      <div class="container">
        <header class="section__head reveal">
          <p class="eyebrow">Flow</p>
          <h2 data-i18n="recruit.flow"></h2>

        <ol class="flow">

          <li class="reveal"><span>02</span><h3 data-i18n="recruit.f2.title"></h3><p data-i18n="recruit.f2.body"></p></li>
